<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Roles de la iglesia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roles">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
:root{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
#home{height:180vh}
#stage{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#logo{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;object-fit:contain;pointer-events:auto}
#menu{position:absolute;left:0;right:0;max-width:460px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:16px;opacity:0}
#menu.on{pointer-events:auto}
.big{display:flex;flex-direction:column;gap:6px;border:2px solid #fff;background:#000;border-radius:32px;padding:20px 22px;text-align:center}
.big .t{font-size:1.2rem;font-weight:800;letter-spacing:.05em}
.big .s{font-size:.9rem;font-weight:500;line-height:1.3;color:rgba(255,255,255,.7)}
.big:active{background:#fff;color:#000}
.big:active .s{color:#000}
.pill{align-self:center;border:1.5px solid rgba(255,255,255,.4);background:#000;border-radius:22px;padding:10px 20px;font-size:.95rem;font-weight:700}
.pill[hidden]{display:none}
.seg{display:flex;border:1.5px solid rgba(255,255,255,.4);border-radius:18px;overflow:hidden}
.seg button{border:0;background:#000;padding:7px 12px;font-size:.85rem;font-weight:700}
.seg button.on{background:#fff;color:#000}
.svc.next{border:2px solid #fff}
.addlabel{margin:14px 0 8px;font-size:.9rem;color:rgba(255,255,255,.7)}
#hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.65);font-size:1rem}
#role{display:none;max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:1.2rem;margin:0;letter-spacing:.05em}
.round{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:#000;font-size:1.4rem;line-height:1;flex:none}
.round:active{background:#fff;color:#000}
.months{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.months input{flex:1;min-width:0;height:46px;border-radius:23px;border:2px solid #fff;background:#000;text-align:center;padding:0 14px;font-weight:700}
.svc{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1.5px solid rgba(255,255,255,.25);border-radius:24px;padding:14px 18px;margin-bottom:10px}
.svc .d{font-weight:800;white-space:nowrap}
.svc .d small{display:block;font-weight:500;color:rgba(255,255,255,.6);font-size:.8rem}
.svc .n{text-align:right;font-weight:600}
.empty{border:1.5px dashed rgba(255,255,255,.35);border-radius:24px;padding:22px;text-align:center;color:rgba(255,255,255,.75);line-height:1.5}
h2{font-size:1.05rem;margin:34px 0 12px}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1.5px solid rgba(255,255,255,.25);border-radius:22px;padding:10px 10px 10px 18px;margin-bottom:8px}
.person .nm{flex:1 1 110px;font-weight:600;overflow-wrap:anywhere}
.person .x{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:#000}
.person .x:active{background:#fff;color:#000}
.add{display:flex;gap:10px;margin-top:12px}
.add input{flex:1;min-width:0;height:48px;border-radius:24px;border:2px solid #fff;background:#000;padding:0 18px}
.add button{height:48px;padding:0 22px;border-radius:24px;border:2px solid #fff;background:#fff;color:#000;font-weight:800}
.step{display:flex;align-items:center;gap:14px;font-weight:700}
.step .round{width:40px;height:40px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="home">
  <div id="stage">
    <img id="logo" alt="Logo de la iglesia">
    <div id="menu">
      <button class="big" data-role="limpieza"><span class="t">ROL DE LIMPIEZA</span><span class="s" id="sub-limpieza"></span></button>
      <button class="big" data-role="dirigentes"><span class="t">ROL DE DIRIGENTES</span><span class="s" id="sub-dirigentes"></span></button>
      <button class="pill" id="bell" hidden></button>
    </div>
    <div id="hint">Desliza hacia abajo</div>
  </div>
</div>

<main id="role">
  <div class="top"><button class="round" id="back" aria-label="Volver">‹</button><h1 id="title"></h1></div>
  <div class="months">
    <button class="round" id="prev" aria-label="Mes anterior">‹</button>
    <input type="month" id="month" aria-label="Elegir mes">
    <button class="round" id="next" aria-label="Mes siguiente">›</button>
  </div>
  <div id="list"></div>
  <h2>Personas por servicio</h2>
  <div class="step"><button class="round" id="kMenos" aria-label="Menos">−</button><span id="kVal"></span><button class="round" id="kMas" aria-label="Más">+</button></div>
  <h2>Personas</h2>
  <div id="people"></div>
  <div class="addlabel">Días que servirá la persona nueva</div><div id="addSeg"></div>
  <form class="add" id="addForm" onsubmit="return false">
    <input id="newName" placeholder="Nombre de la persona" autocomplete="off">
    <button id="addBtn" type="button">Agregar</button>
  </form>
</main>

<script>
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIA={4:'Jueves',0:'Domingo'};
const KEY='iglesia-roles-v1';
const $=id=>document.getElementById(id);
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{};
S.limpieza=S.limpieza||{p:[],k:2,s:{}};
S.dirigentes=S.dirigentes||{p:[],k:1,s:{}};
['limpieza','dirigentes'].forEach(r=>{S[r].p=S[r].p.map(x=>typeof x==='string'?{n:x,d:'ambos'}:x)});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Inicio: logo grande → pequeño + menú ---------- */
function layout(){
  const H=innerHeight,W=innerWidth,p=Math.min(1,scrollY/(H*.45));
  const m=$('menu'),mh=m.offsetHeight;
  const big=Math.min(W*.74,H*.46,360),small=Math.min(150,W*.36,H*.2),sz=big+(small-big)*p;
  const top1=Math.max(36,(H-(small+26+mh))/2);
  const top=((H-big)/2-20)*(1-p)+top1*p;
  const l=$('logo');l.style.width=l.style.height=sz+'px';l.style.top=top+'px';
  m.style.top=(top+sz+26)+'px';m.style.opacity=p;m.classList.toggle('on',p>.6);
  $('hint').style.opacity=Math.max(0,1-p*3);
}
addEventListener('scroll',layout,{passive:true});addEventListener('resize',layout);layout();

/* ---------- Lógica de roles ---------- */
let role=null,cur=new Date(),savedY=0;
cur=new Date(cur.getFullYear(),cur.getMonth(),1);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function services(y,m){const out=[],n=new Date(y,m+1,0).getDate();
  for(let d=1;d<=n;d++){const x=new Date(y,m,d),w=x.getDay();if(w===4||w===0)out.push(x)}return out}
function countBefore(end){let c=0;for(let x=new Date(2024,0,1);x<end;x.setDate(x.getDate()+1)){const w=x.getDay();if(w===4||w===0)c++}return c}
function gen(r,y,m){
  const R=S[r],id=ym(new Date(y,m,1));
  if(R.s[id])return R.s[id];
  if(!R.p.length)return null;
  const pv=R.s[ym(new Date(y,m-1,1))]||{};
  const cnt=Object.assign({},pv.cnt),last=Object.assign({},pv.last);
  let seq=pv.seq||0;
  const known=R.p.filter(q=>cnt[q.n]!==undefined).map(q=>cnt[q.n]),base=known.length?Math.min(...known):0;
  R.p.forEach((q,i)=>{if(cnt[q.n]===undefined){cnt[q.n]=base;last[q.n]=-1e6+i}});
  const rows=services(y,m).map(d=>{
    const w=d.getDay(),dia=w===4?'jue':'dom';
    const pick=R.p.filter(q=>q.d==='ambos'||q.d===dia)
      .sort((a,b)=>cnt[a.n]-cnt[b.n]||last[a.n]-last[b.n]).slice(0,R.k);
    pick.forEach(q=>{cnt[q.n]++;last[q.n]=seq});seq++;
    return{d:d.getDate(),w,a:pick.map(q=>q.n)};
  });
  return R.s[id]={rows,cnt,last,seq};
}
/* Al cambiar personas se reacomodan el mes actual y los siguientes; los meses pasados se conservan */
function reset(r){const now=ym(new Date()),R=S[r];Object.keys(R.s).forEach(k=>{if(k>=now)delete R.s[k]});save();ensure(r,'cambio');updateMenu();render()}
function seg(val,fn){const d=document.createElement('div');d.className='seg';
  [['ambos','Ambos'],['jue','Jueves'],['dom','Domingo']].forEach(([v,t])=>{
    const b=document.createElement('button');b.type='button';b.textContent=t;if(v===val)b.className='on';
    b.setAttribute('aria-pressed',v===val);b.onclick=()=>fn(v);d.appendChild(b)});
  return d}
let addD='ambos';
function nextService(r){
  const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  for(let i=0;i<3;i++){const d=new Date(t0.getFullYear(),t0.getMonth()+i,1),sc=gen(r,d.getFullYear(),d.getMonth());
    if(!sc)return null;
    for(const x of sc.rows){if(new Date(d.getFullYear(),d.getMonth(),x.d)>=t0)return{y:d.getFullYear(),m:d.getMonth(),d:x.d,w:x.w,a:x.a}}}
  return null}
function render(){
  const R=S[role],y=cur.getFullYear(),m=cur.getMonth();
  $('title').textContent=NOMBRE[role].toUpperCase();
  $('month').value=ym(cur);
  const L=$('list');L.textContent='';
  const sch=gen(role,y,m),nx=nextService(role);
  if(!sch){const e=document.createElement('div');e.className='empty';e.textContent='Agrega personas abajo y el rol del mes se arma solo.';L.appendChild(e)}
  else sch.rows.forEach(r=>{
    const isN=nx&&nx.y===y&&nx.m===m&&nx.d===r.d;
    const c=document.createElement('div');c.className='svc'+(isN?' next':'');
    const d=document.createElement('div');d.className='d';d.textContent=DIA[r.w]+' '+r.d;
    const s=document.createElement('small');s.textContent=MES[m]+(isN?' · Próximo':'');d.appendChild(s);
    const n=document.createElement('div');n.className='n';n.textContent=r.a.length?r.a.join(' · '):'Sin persona disponible';
    c.append(d,n);L.appendChild(c);
  });
  $('kVal').textContent=R.k+(R.k===1?' persona':' personas');
  const P=$('people');P.textContent='';
  if(!R.p.length){const e=document.createElement('div');e.className='empty';e.textContent='Todavía no hay personas.';P.appendChild(e)}
  R.p.forEach((q,i)=>{
    const row=document.createElement('div');row.className='person';
    const t=document.createElement('span');t.className='nm';t.textContent=q.n;
    const g=seg(q.d,v=>{q.d=v;reset(role)});
    const b=document.createElement('button');b.className='x';b.textContent='✕';b.setAttribute('aria-label','Quitar '+q.n);
    b.onclick=()=>{if(confirm('¿Quitar a '+q.n+'? El rol de este mes y los siguientes se reacomodará.')){R.p.splice(i,1);reset(role)}};
    row.append(t,g,b);P.appendChild(row);
  });
  const A=$('addSeg');A.textContent='';A.appendChild(seg(addD,v=>{addD=v;render()}));
}
function openRole(r){role=r;savedY=scrollY;$('home').style.display='none';$('role').style.display='block';scrollTo(0,0);render()}
function closeRole(){$('role').style.display='none';$('home').style.display='block';scrollTo(0,savedY);updateMenu()}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>openRole(b.dataset.role));
$('back').onclick=closeRole;
$('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$('month').onchange=e=>{const v=e.target.value;if(!v)return;const[a,b]=v.split('-').map(Number);cur=new Date(a,b-1,1);render()};
$('kMenos').onclick=()=>{if(S[role].k>1){S[role].k--;reset(role)}};
$('kMas').onclick=()=>{if(S[role].k<6){S[role].k++;reset(role)}};
function add(){const v=$('newName').value.trim();if(!v)return;
  if(S[role].p.some(x=>x.n.toLowerCase()===v.toLowerCase())){alert('Esa persona ya está en la lista.');return}
  S[role].p.push({n:v,d:addD});$('newName').value='';reset(role)}
$('addBtn').onclick=add;
$('newName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};

/* ---------- Avisos, resumen del menú e inicio ---------- */
const NOMBRE={limpieza:'Rol de limpieza',dirigentes:'Rol de dirigentes'};
function notify(t,b){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const o={body:b,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'roles'};
    const plain=()=>{try{new Notification(t,o)}catch(e){}};
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
      navigator.serviceWorker.getRegistration().then(g=>g?g.showNotification(t,o):plain()).catch(plain);
    else plain();
  }catch(e){}
}
function ensure(r,why){
  const t=new Date(),out=[];
  for(let i=0;i<2;i++){
    const d=new Date(t.getFullYear(),t.getMonth()+i,1);
    if(!S[r].s[ym(d)]&&S[r].p.length){gen(r,d.getFullYear(),d.getMonth());out.push(MES[d.getMonth()])}
  }
  if(out.length){save();
    notify(why==='cambio'?NOMBRE[r]+' actualizado':'Nuevo '+NOMBRE[r].toLowerCase(),
           (why==='cambio'?'Se reacomodó: ':'Ya está listo: ')+out.join(' y ')+'.')}
}
function updateMenu(){
  ['limpieza','dirigentes'].forEach(r=>{
    const x=nextService(r),e=$('sub-'+r);
    e.textContent=x?DIA[x.w]+' '+x.d+' de '+MES[x.m].toLowerCase()+' · '+(x.a.length?x.a.join(' y '):'sin persona disponible'):'Agrega personas para generar el rol';
  });
  layout();
}
function bellLabel(){
  const b=$('bell');
  if(!('Notification' in window)){b.hidden=true;return}
  b.hidden=false;const p=Notification.permission;
  b.textContent=p==='granted'?'Avisos activados':p==='denied'?'Avisos bloqueados en este navegador':'Activar avisos';
  layout();
}
$('bell').onclick=()=>{
  if(!('Notification' in window))return;
  if(Notification.permission==='default')Notification.requestPermission().then(()=>{bellLabel();notify('Avisos activados','Te avisaremos cuando se genere un nuevo rol.')});
  else if(Notification.permission==='granted')notify('Avisos activados','Así se verá el aviso de un nuevo rol.');
};
function start(){['limpieza','dirigentes'].forEach(r=>ensure(r,'nuevo'));bellLabel();updateMenu()}
start();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){start();if(role)render()}});

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
